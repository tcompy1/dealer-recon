services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-dealer_recon}
      POSTGRES_USER: ${POSTGRES_USER:-dealer_recon}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dealer_recon}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-dealer_recon} -d ${POSTGRES_DB:-dealer_recon}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
      target: dev
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://dealer_recon:dealer_recon@db:5432/dealer_recon}
      UPLOAD_STORAGE_PATH: ${UPLOAD_STORAGE_PATH:-/app/storage/uploads}
      BACKEND_CORS_ORIGINS: ${BACKEND_CORS_ORIGINS:-http://localhost:5173}
      DEFAULT_DEALERSHIP_ID: ${DEFAULT_DEALERSHIP_ID:-1}
      SESSION_SECRET: ${SESSION_SECRET:-local-dev-session-secret-change-before-production}
    ports:
      - "8000:8000"
    command: sh -c "npm run migrate && npm run dev"
    volumes:
      - ./server:/app/server
      - server_node_modules:/app/server/node_modules
      - ./sample-data:/app/sample-data
      - ./storage/uploads:/app/storage/uploads
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8000/health').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
      target: dev
    environment:
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8000}
    ports:
      - "5173:5173"
    volumes:
      - ./frontend/src:/app/frontend/src
      - ./frontend/index.html:/app/frontend/index.html
      - ./frontend/vite.config.ts:/app/frontend/vite.config.ts
      - ./frontend/tailwind.config.ts:/app/frontend/tailwind.config.ts
      - ./frontend/postcss.config.js:/app/frontend/postcss.config.js
      - ./frontend/tsconfig.json:/app/frontend/tsconfig.json
      - ./frontend/tsconfig.app.json:/app/frontend/tsconfig.app.json
    depends_on:
      backend:
        condition: service_healthy

volumes:
  postgres_data:
  server_node_modules:
